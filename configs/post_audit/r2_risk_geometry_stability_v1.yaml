schema: npi.post-audit.r2-risk-geometry-config.v1
output_path: results/post_audit/r2_risk_geometry_stability_v1.json
proposal_artifact_path: results/post_audit/r2_family_diagnosis_five_fit_v1.json
method: parent-as-is
torch_threads: 1
geometry: {training_count: 8192, calibration_count: 4096, rank: 4, outside_probability: 0.05}
direct: {count: 65536, batch_size: 8192}
risk: {particles: 128, replicates: 16, levels: 48, mutation_steps: 2, maximum_relative_se: 0.2}
candidates:
  - {id: original, bridge_power: 4, resample_every: 4, resampling_scheme: stratified, pcn_scale: 0.35}
  - {id: linearized-bridge-frequent, bridge_power: 2, resample_every: 1, resampling_scheme: stratified, pcn_scale: 0.35}
  - {id: lower-scale-bridge, bridge_power: 2, resample_every: 4, resampling_scheme: stratified, pcn_scale: 0.20}
budget: {max_potential_evaluations: 8500000, max_wall_seconds: 600.0}
decision:
  required_precision_passes_per_cell: 5
  minimum_precision_designs_for_crosscheck: 2
  maximum_relative_normalizer_difference: 0.25
role: risk_stability_and_proposal_geometry_development_not_confirmation
