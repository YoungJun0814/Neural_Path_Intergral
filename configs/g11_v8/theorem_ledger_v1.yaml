theorems:
  - id: T-V8-1
    title: exact defensive-mixture likelihood
    status: proved_finite_dimensional
    scope: finite-dimensional identity-covariance deterministic Gaussian-shift mixture
    assumptions:
      - positive normalized mixture weights
      - natural zero-mean component with positive mass
      - bounded finite-grid event indicator
    conclusion: exact ordinary-mean estimator, pathwise likelihood bound, and square integrability
    code_evidence:
      - src/path_integral/mixture.py
      - src/path_integral/gaussian_span_marginalization.py
    test_evidence:
      - tests/test_gaussian_span_marginalization.py
      - tests/test_g11_v8_finite_grid_theorems.py
    external_review_required: true

  - id: T-V8-2
    title: proposal-conditional DCS identity
    status: proved_finite_dimensional
    scope: exact target-over-mixture likelihood followed by target conditional integration
    assumptions:
      - deterministic orthonormal integration span
      - exact full and residual mixture likelihoods
      - no clipping or self-normalization
    conclusion: DCS equals the proposal conditional expectation of the raw contribution
    code_evidence:
      - src/path_integral/gaussian_span_marginalization.py
      - src/path_integral/rbergomi_dcs_mlmc.py
    test_evidence:
      - tests/test_gaussian_span_marginalization.py
      - tests/test_rbergomi_dcs_mlmc.py
    external_review_required: true

  - id: T-V8-3
    title: exact Rao-Blackwell variance decomposition
    status: proved_finite_dimensional
    scope: square-integrable raw contribution under the identical proposal
    assumptions:
      - T-V8-1
      - T-V8-2
    conclusion: raw variance equals DCS variance plus expected conditional variance
    code_evidence:
      - src/path_integral/rao_blackwell.py
    test_evidence:
      - tests/test_g11_v7_mechanism_probe.py
      - tests/test_g11_v8_finite_grid_theorems.py
    external_review_required: true

  - id: T-V8-4
    title: strict scalar-threshold improvement and localized lower bound
    status: proved_with_explicit_scope
    scope: rank-one finite scalar threshold under a positive Gaussian mixture
    assumptions:
      - finite threshold on a residual set of positive probability
      - finite deterministic projected component means
      - positive mixture weights
      - defensive square-integrability contract
    conclusion: pointwise positive conditional-variance lower bound and strict population variance reduction
    code_evidence:
      - src/path_integral/gaussian_mixture_strictness.py
    test_evidence:
      - tests/test_g11_v8_finite_grid_theorems.py
    external_review_required: true

  - id: T-V8-5
    title: terminal and discrete-barrier scalar thresholds
    status: proved_finite_grid
    scope: finite monitoring grid with strictly positive post-initial affine slopes
    assumptions:
      - finite log-spot intercepts
      - zero time-zero slope
      - strictly positive post-initial slopes
      - closed downside event convention
    conclusion: exact finite terminal threshold and finite barrier maximum unless hit at time zero
    code_evidence:
      - src/path_integral/rbergomi_dcs_mlmc.py
    test_evidence:
      - tests/test_rbergomi_dcs_mlmc.py
      - tests/test_g11_v8_finite_grid_theorems.py
    external_review_required: true

