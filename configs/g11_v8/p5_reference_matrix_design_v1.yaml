    - antithetic_mc
    - conditional_rbergomi
    - pure_cem
    - defensive_cem
    - smoothing_rqmc
    - ld_subspace_is
    - flow_is
  fresh_training_per_task_and_cell: true
  training_seed_namespace: p5-training
  pilot_seed_namespace: p5-pilot
  final_seed_namespace: p5-final-method

robustness_one_factor_at_a_time:
  hurst: [0.05, 0.30]
  eta: [0.8, 2.2]
  rho: [-0.3, -0.9]
  maturity: [0.25, 2.0]
