sources:
  - id: friz_salkeld_wagenhofer_2025
    family: rough_weak_error
    title: Weak error estimates for rough volatility models
    authors: [Peter K. Friz, William Salkeld, Thomas Wagenhofer]
    year: 2025
    primary_url: https://arxiv.org/abs/2212.01591
    version: arXiv v2, 2024-08-28
    doi: https://doi.org/10.1214/24-AAP2109
    peer_review_status: published
    overlap: nonlinear rough-volatility weak rates including rough Bergomi and an optimality lower bound
    nonoverlap: no rare indicator, defensive Gaussian mixture, or proposal-conditional event-span marginalization
    consequence: V8 cannot claim the first nonlinear rough-volatility weak-rate theorem
  - id: gassiat_2023
    family: rough_weak_error
    title: Weak Error Rates of Numerical Schemes for Rough Volatility
    authors: [Paul Gassiat]
    year: 2023
    primary_url: https://arxiv.org/abs/2203.09298
    version: published SIAM J. Financial Mathematics 14(2)
    doi: https://doi.org/10.1137/22M1485760
    peer_review_status: published
    overlap: hybrid-scheme weak rates and explicit applicability to 3R orthogonal-projection schemes
    nonoverlap: special smooth or polynomial tests rather than defensive-mixture rare indicators
    consequence: hybrid weak-rate and projection ingredients are prior art
  - id: bayer_fukasawa_nakahara_2022
    family: rough_weak_error
    title: On the weak convergence rate in the discretization of rough volatility models
    authors: [Christian Bayer, Masaaki Fukasawa, Shonosuke Nakahara]
    year: 2022
    primary_url: https://arxiv.org/abs/2203.02943
    version: arXiv v1, 2022-03-06
    doi: https://doi.org/10.48550/arXiv.2203.02943
    peer_review_status: preprint
    overlap: general lower bound 2H and sharper linear-model weak rate
    nonoverlap: no conditional rare-event integration or exact residual mixture likelihood
    consequence: conservative H-rate claims are not novel by themselves
  - id: fukasawa_hirano_2021
    family: rough_simulation_projection
    title: Refinement by reducing and reusing random numbers of the Hybrid scheme for Brownian semistationary processes
    authors: [Masaaki Fukasawa, Asuto Hirano]
    year: 2021
    primary_url: https://doi.org/10.1080/14697688.2020.1866209
    version: Quantitative Finance 21(7), 1127-1146
    doi: https://doi.org/10.1080/14697688.2020.1866209
    peer_review_status: published
    overlap: orthogonal projections and reduced random-number simulation for rough Bergomi
    nonoverlap: projection is for simulation refinement, not exact likelihood marginalization of a rare event under a defensive mixture
    consequence: orthogonal projection cannot be claimed as a new ingredient
  - id: ahn_zheng_2023
    family: conditional_importance_sampling
    title: Conditional Importance Sampling for Convex Rare-Event Sets
    authors: [Dohyun Ahn, Lewen Zheng]
    year: 2023
    primary_url: https://doi.org/10.1109/WSC60868.2023.10408303
    version: 2023 Winter Simulation Conference proceedings
    doi: https://doi.org/10.1109/WSC60868.2023.10408303
    peer_review_status: published
    overlap: conditional importance sampling and bounded-relative-error analysis for convex rare events
    nonoverlap: different conditional proposal construction; no rough Volterra model or defensive balance-mixture marginal likelihood
    consequence: conditional importance sampling and rare-event efficiency are prior art terms
  - id: jacquier_pannier_2021
    family: volterra_rare_event
    title: Large and moderate deviations for stochastic Volterra systems
    authors: [Antoine Jacquier, Alexandre Pannier]
    year: 2021
    primary_url: https://arxiv.org/abs/2004.10571
    version: arXiv v3
    doi: https://doi.org/10.48550/arXiv.2004.10571
    peer_review_status: published
    overlap: pathwise large deviations for stochastic Volterra systems encompassing rough-volatility models
    nonoverlap: no finite-grid defensive-mixture DCS estimator or training-inclusive comparison
    consequence: a Volterra large-deviation control principle is prior art
  - id: bures_2025
    family: rough_barrier_analysis
    title: On the short-time behaviour of up-and-in barrier options using Malliavin calculus
    authors: [Oscar Bures]
    year: 2025
    primary_url: https://arxiv.org/abs/2510.15423
    version: arXiv v1, 2025-10-17
    doi: https://doi.org/10.48550/arXiv.2510.15423
    peer_review_status: preprint
    overlap: supremum-density and concentration bounds with a rough Bergomi application
    nonoverlap: short-maturity barrier asymptotics rather than mesh-enrichment error for DCS
    consequence: barrier anti-concentration claims require explicit comparison to this analysis
